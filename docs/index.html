<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>SMGo</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./style.css">
  <script>(function(){var t=localStorage.getItem('smgo_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="app">

  <div id="offline-banner">Offline – using cached data</div>

  <!-- Header -->
  <div id="header">
    <h1>SMGo</h1>
    <span id="progress-text">–</span>
    <button id="extract-badge-btn" style="display:none" title="Pending extracts">
      ✂ <span id="extract-count">0</span>
    </button>
    <button id="theme-toggle" title="Toggle theme">☀️</button>
    <span id="settings-icon" title="Settings">⚙</span>
  </div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>

  <!-- Loading screen -->
  <div id="screen-loading">
    <div class="spinner"></div>
    <p style="color:var(--muted);font-size:.9rem">Loading today's items…</p>
    <div id="server-url-wrap"></div>
  </div>

  <!-- Error screen -->
  <div id="screen-error" style="display:none">
    <div style="font-size:2.5rem">⚠️</div>
    <p style="font-weight:600">Could not load items</p>
    <p id="error-msg" style="color:var(--muted);font-size:.85rem"></p>
    <p id="error-hint" style="color:var(--muted);font-size:.8rem"></p>
    <button id="retry-btn" style="margin-top:8px;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:1rem;cursor:pointer">Retry</button>
  </div>

  <!-- Done screen -->
  <div id="screen-done" style="display:none">
    <div class="big-check">✅</div>
    <p style="font-weight:600;font-size:1.1rem">Session complete!</p>
    <p id="done-msg" style="color:var(--muted);font-size:.9rem"></p>
    <p id="done-sub" style="color:var(--muted);font-size:.8rem;margin-top:4px"></p>
    <button id="done-restart-btn" style="margin-top:16px;padding:10px 24px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:.9rem;cursor:pointer">Review again from start</button>
  </div>

  <!-- Review card area (injected by app.js) -->
  <div id="card-area" style="display:none"></div>

  <!-- Action area -->
  <div id="action-area" style="display:none">
    <!-- Appears when text is selected — anchored at bottom, away from Android copy/paste menu -->
    <div id="selection-bar" style="display:none">
      <span id="selection-label">Selected — add to SM:</span>
      <button id="extract-btn">✂ Extract</button>
      <button id="cloze-btn">[ ] Cloze</button>
      <button id="qa-btn">🤖 Q&A</button>
    </div>
    <button id="reveal-btn">Show Answer</button>
    <div id="grade-row"></div>
    <div id="card-meta-row">
      <button id="skip-btn" class="secondary-btn">Skip →</button>
      <button id="dismiss-btn" class="secondary-btn dismiss-btn" style="display:none">Dismiss element</button>
    </div>
    <div id="sync-status"></div>
  </div>

  <!-- Extract drawer (slides up from bottom) -->
  <div id="extract-drawer">
    <div id="extract-drawer-header">
      <span>Pending Extracts</span>
      <button id="extract-drawer-close">✕</button>
    </div>
    <div id="extract-list"></div>
    <div id="extract-drawer-footer">
      <button id="extract-sync-btn">Sync to server</button>
      <button id="extract-clear-btn">Clear all</button>
    </div>
  </div>
  <div id="extract-drawer-backdrop"></div>

  <!-- Cloze creation modal -->
  <div id="cloze-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Create Cloze</span>
        <button id="cloze-modal-close">✕</button>
      </div>
      <p class="modal-hint">Tap words to blank them</p>
      <div id="cloze-word-editor"></div>
      <div class="modal-preview-row">
        <span class="modal-preview-label">Preview:</span>
        <span id="cloze-preview"></span>
      </div>
      <div class="modal-footer">
        <button id="cloze-cancel-btn" class="secondary-btn">Cancel</button>
        <button id="cloze-save-btn" class="primary-btn">Save Cloze</button>
      </div>
    </div>
  </div>

  <!-- Q&A modal -->
  <div id="qa-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Generate Q&amp;A</span>
        <button id="qa-modal-close">✕</button>
      </div>
      <div id="qa-loading" style="display:none">
        <div class="spinner" style="margin:24px auto"></div>
        <p style="text-align:center;color:var(--muted);font-size:.85rem">Generating with Gemini…</p>
      </div>
      <div id="qa-form" style="display:none">
        <label class="qa-label">Question</label>
        <textarea id="qa-question" class="qa-textarea" rows="3"></textarea>
        <label class="qa-label">Answer</label>
        <textarea id="qa-answer" class="qa-textarea" rows="3"></textarea>
      </div>
      <div class="modal-footer">
        <button id="qa-cancel-btn" class="secondary-btn">Cancel</button>
        <button id="qa-save-btn" class="primary-btn">Save Q&amp;A</button>
      </div>
    </div>
  </div>

</div>
<script src="./app.js"></script>
</body>
</html>
